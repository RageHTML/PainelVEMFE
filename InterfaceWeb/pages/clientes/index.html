{% extends "shared/navbar.html" %}
{% block title %}Novo Cliente - PainelVF{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="/static/pages/clientes/style.css">
{% endblock %}

{% block extra_js %}
    <script src="/static/pages/clientes/script.js" defer></script>
{% endblock %}


{% block content %}
    <form action="/clientes/registrar" method="post" id="form">
        <label for="nome_completo">Nome Completo:</label>
        <input type="text" id="nome_completo" name="nome_completo" placeholder="Ex: Maria Lucia">

        <label for="nome_mae">Nome da Mãe:</label>
        <input type="text" id="nome_mae" name="nome_mae" placeholder="Ex: Ana Maria">

        <label for="cpf">CPF (Apenas números):</label>
        <input type="text" id="cpf" name="cpf" placeholder="12345678900">

        <label for="data_nascimento">Data de Nascimento:</label>
        <input type="date" id="data_nascimento" name="data_nascimento">

        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro">

        <button type="submit">Enviar</button>
    </form>
{% endblock %}
