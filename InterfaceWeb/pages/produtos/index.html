{% extends "shared/navbar.html" %}

{% block title %}Novo Produto - PainelVF{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="/static/pages/produtos/style.css">
{% endblock %}

{% block extra_js %}
    <script src="/static/pages/produtos/script.js" defer></script>
{% endblock %}

{% block content %}
    <form action="/produtos/clientes" method="post" id="form">
        <label for="nome_completo">Cliente (digite para buscar):</label><br>
        <input type="text" id="nome_completo" list="lista_clientes" autocomplete="off" placeholder="Digite o nome...">
        <datalist id="lista_clientes"></datalist>

        <input type="hidden" id="cliente_id"><br><br>

        <label for="descricao">Descrição do Produto:</label><br>
        <textarea id="descricao" rows="10" cols="50" placeholder="Escreva os detalhes do produto..."></textarea><br><br>

        <label for="valor">Valor (R$):</label><br>
        <input type="text" id="valor" placeholder="Ex: 150.00"><br><br>

        <label for="forma_pagamento">Forma de Pagamento:</label><br>
        <select id="forma_pagamento">
            <option value="credito">Crédito</option>
            <option value="debito">Débito</option>
            <option value="pix">PIX</option>
            <option value="dinheiro">Dinheiro</option>
        </select><br><br>

        <button type="submit">Enviar</button>
    </form>
    
    <p id="log"></p> 
{% endblock %}
