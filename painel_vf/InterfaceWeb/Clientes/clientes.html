<!DOCTYPE html>
<html>
    <head>
        <title>PainelVF</title>
        <script src="/static/clientes/cliente.js" defer></script> 
    </head>
    <body>
        <h1>Novo Cliente</h1>
        <form action="/clientes/registrar" method="post" id="form">
            <label for="nome_completo">Nome Completo:</label><br>
            <input type="text" id="nome_completo" placeholder="Ex: Maria Lucia"><br><br>

            <label for="nome_mae">Nome da Mãe:</label><br>
            <input type="text" id="nome_mae" placeholder="Ex: Ana Maria"><br><br>

            <label for="cpf">CPF (Apenas números):</label><br>
            <input type="text" id="cpf" placeholder="12345678900"><br><br>

            <label for="data_nascimento">Data de Nascimento:</label><br>
            <input type="date" id="data_nascimento"><br><br>

            <label for="endereco">Endereço:</label><br>
            <input type="text" id="endereco" placeholder="Rua, número, bairro"><br><br>

            <button type="submit">Enviar</button>
        </form>
    </body>
</html>
