[project]
name = "painel-vf"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",
    "psycopg2>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv-vault>=0.7.0",
    "sqlmodel>=0.0.39",
    "typing>=3.10.0.0",
]

[tool.fastapi]
entrypoint = "main:app"
