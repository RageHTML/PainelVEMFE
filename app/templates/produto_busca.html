{% extends "global.html" %}

{% block title %}Novo Produto - PainelVF{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="/static/css/produto_busca.css">
{% endblock %}

{% block extra_js %}
    <script src="/static/js/produto_busca.js" defer></script>
{% endblock %}

{% block content %}
    <nav class="nav-produto">
        <a href="/produtos/novo">Novo Produto</a>
        <a href="/produtos">Produtos do Cliente</a>
    </nav>
    <form method="post" id="form">
        <div class="form-row">
            <div class="input-group">
                <label for="busca">Buscar cliente por nome ou CPF:</label>
                <input type="text" id="busca" name="busca" list="lista_clientes" autocomplete="off" placeholder="Digite o nome...">
                <datalist id="lista_clientes"></datalist>
            </div>
            <button type="submit">Enviar</button>
        </div>
        <form>
                
        </form>
        </div>
    </form>
{% endblock %}
