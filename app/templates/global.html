<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PainelVF{% endblock %}</title>
    
    <link rel="stylesheet" href="/static/css/global.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div id="notificacao-container"></div>

    <aside id="sidebar" class="sidebar">
        <button id="toggle-btn" class="toggle-btn" aria-label="Menu">
            &#8226;&#8226;&#8226;
        </button>

        <nav class="nav-menu">
            <a href="/" class="nav-link {% if pagina_atual == 'raiz' %}active{% endif %}">
                <span class="icon">🏠</span>
                <span class="text">Inicio</span>
            </a>
        
            <a href="/clientes" class="nav-link {% if pagina_atual == 'clientes' %}active{% endif %}">
                <span class="icon">👤</span>
                <span class="text">Clientes</span>
            </a>
            <a href="/produtos" class="nav-link {% if pagina_atual == 'produtos' %}active{% endif %}">
                <span class="icon">📦</span>
                <span class="text">Produtos</span>
            </a>

            <a href="/contratos" class="nav-link {% if pagina_atual == 'contratos' %}active{% endif %}">
                <span class="icon">📝</span>
                <span class="text">Gerar Contratos</span>
            </a>
        </nav>
    </aside>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/js/global.js" defer></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
