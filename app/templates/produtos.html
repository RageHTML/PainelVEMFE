{% extends "global.html" %}

{% block title %}Novo Produto - PainelVF{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="/static/css/produtos.css">
{% endblock %}

{% block extra_js %}
    <script src="/static/js/produtos.js" defer></script>
{% endblock %}

{% block content %}
    <form method="post" id="form">
        <div class="form-row">
            <div class="input-group">
                <label for="busca">Buscar cliente por nome ou CPF:</label>
                <input type="text" id="busca" name="busca" list="lista_clientes" autocomplete="off" placeholder="Digite o nome...">
                <datalist id="lista_clientes"></datalist>
            </div>
            <button type="submit">Enviar</button>
        </div>
    </form>
{% endblock %}
