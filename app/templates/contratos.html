{% extends "global.html" %}

{% block title %}
    Gere um contrato
{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="/static/css/contratos.css">
{% endblock %}

{% block extra_js %}
    <script src="/static/js/contratos.js" defer></script>
{% endblock %}

{% block content %}
    <h1>Contratos</h1>
    <form action="/contratos" method="post" id="form">
        <label for="nome_completo">Cliente (digite para buscar):</label><br>
        <input type="text" id="nome_completo" name="nome_completo" list="lista_clientes" autocomplete="off" placeholder="Digite o nome...">
        <datalist id="lista_clientes"></datalist>
        <button type="submit">Gerar</button>
    </form>
{% endblock %}
